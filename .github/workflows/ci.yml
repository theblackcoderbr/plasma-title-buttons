name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Nix)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2

      - name: Validate workflow, build, test and stage installation
        run: |
          wtb_bash=$(nix-build --no-out-link --max-jobs 2 --cores 2 -E '(import ./nix/pkgs.nix).bashInteractive')
          export NIX_BUILD_SHELL="$wtb_bash/bin/bash"
          export NIX_PATH=
          nix-shell --pure --run 'bash tests/ci.sh'

      - name: Upload validation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            build-ci/logs/
            build-ci/junit.xml
            build-ci/Testing/Temporary/
            build-ci/CMakeFiles/CMakeConfigureLog.yaml
